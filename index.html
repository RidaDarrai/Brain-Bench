<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0d0d0d" />
    <meta
      name="description"
      content="Brain Bench — measure your reaction time, memory, and aim with fun cognitive tests."
    />
    <title>Brain Bench — Cognitive Tests</title>
    <script>
      // Apply the stored theme before first paint (no flash of wrong theme).
      (function () {
        try {
          if (localStorage.getItem('brainbench-theme') === 'light') {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          /* storage unavailable — stay on the default dark theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
